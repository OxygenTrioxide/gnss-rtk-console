# ============================================================
# GNSS RTK 定位配置文件
# 以 # 开头的是注释；程序按键名读取，行顺序不限，缺失键用默认值
# ============================================================
[RTK configuration file]

# 数据源模式：1=文件模式（读取下方两个观测文件），0=网络模式（连接下方 IP:端口）
FROM FILE OR COM: 1

# 解算模式：1=EKF（卡尔曼滤波），2=LSQ（最小二乘）
# 与课件 2-1 第 24 页 ROVERCFGINFO 注释 "1=EKF, 2=LSQ" 一致
RTK PROCESSING MODE: 1

# 网络模式下流动站/基站的 IP 与端口（文件模式下不用）
# 基站位于工学部楼顶（47.114.134.129:7190），流动站位于测绘学院楼顶（8.148.22.229:7201）
ROVER IP ADDRESS AND PORT: 8.148.22.229 7201
BASE IP ADDRESS AND PORT: 47.114.134.129 7190
# 串口模式下基站 / 流动站的 COM 口号与波特率（格式：COM号 波特率，两个数字）
# 示例为 基站 COM3、流动站 COM4，均 230400 bps；按实际接线修改
BASE COM SETUP: 3 230400
ROVER COM SETUP: 4 230400

# 文件模式的观测数据文件路径（基站 / 流动站）——2026-10-18/19 录制的全天数据
BASE OBSDATA SOURCE FILE: C:/Users/OXYGEN DIOXIDE/Desktop/gnss/rtk-record/base.bin
ROVER OBSDATA SOURCE FILE: C:/Users/OXYGEN DIOXIDE/Desktop/gnss/rtk-record/rover.bin

# 参考坐标文件（.pos-lsq 格式：周 秒 B L H）：逐历元作为流动站真值，计算 E/N/U 差值
# 本文件为稳定参考点：基站已知坐标 + 标定基线向量（-469.568, 702.675, -1405.092）推算，
# 不用接收机自解坐标（其自身会失锁跳变，污染误差统计）
POSITION RESULT FILE: C:/Users/OXYGEN DIOXIDE/Desktop/gnss/rtk-record/rover_ref_static.pos-lsq

# 伪距 / 载波相位先验噪声（米），参与随机模型定权
CODE AND CARRIER PHASE NOISE: 0.5 0.002

# 截止高度角（度），低于该值的卫星不参与解算
THRESHOLD FOR ELEVATION MASK: 10.0

# 对流层延迟模型：0=Hopfield，1=Saastamoinen
TROP MODEL: 0

# 双差固定解 ratio 检验阈值，大于该值才输出固定解
RATIO FOR DD FIXED SOLUTION: 3.0

# 模糊度确认检验①（基线一致性 χ²）的未建模误差方差地板（米）
# 实基线两站多路径不共模，浮点基线实际误差约 1 分米，而形式协方差只含观测噪声、
# 长时间滤波后会乐观到毫米级，不加地板会把正确固定全部误拒；0 = 不加地板
AMB TEST SIGMA FLOOR: 0.1

# 模糊度确认检验②（单位权中误差一致性）的 χ² 上界放宽倍数
# 载波权（σ≈2mm）远严于实际载波噪声（含多路径 1~3cm），检验②被相位残差主导，
# 除以 σ̂₀² 后判别尺度随数据集漂移（同一天不同时段可差 4 倍），默认 2 偏严；
# 实基线实时数据建议 8（等效拒绝相位残差 RMS >1cm 历元），零基线共模多路径小可用 2
AMB TEST VAR FACTOR: 8.0

# 网络模式断线自动重连预算（分钟）：数据流中断后每 30 秒重试连接，
# 在预算内重连成功则继续解算（基站坐标已锁存不受影响，模糊度按周跳重新收敛）；
# 预算耗尽才结束。0 = 不重连（断流即结束）
NET RECONNECT MINUTES: 30
# 原始数据录制开关（仅网络模式）：1=解算时把基站/流动站原始数据流
# 同步录成 base_record.bin / rover_record.bin 存到输出目录，事后可回放
# 分析干扰（文件约 1MB/分钟/站，24 小时约 1.5GB/站，注意磁盘空间）
RECORD RAW DATA: 0

# 结果输出开关：1=输出该结果文件，0=不输出
ENABLE SPP OUTPUT: 1
ENABLE FLOAT OUTPUT: 1
ENABLE FIXED OUTPUT: 1

# 结果文件格式：0=txt，1=csv
RESULT FILE FORMAT: 0

# 附加输出目录（留空表示不写额外输出）
OUTPUT DIRECTORY:

# 最长解算时长（分钟），到点后正常收尾：打印统计摘要、退出码 0（GUI 判"成功"）
# 0 或缺省 = 不限时（网络/串口实时模式会一直跑，需手动停止）
# 例如连续采集 8 小时填 480
MAX RUNNING MINUTES: 0
EOF
